<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elan Saytı</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: #1e293b; }
    h1, h2, h3 { text-align: center; }
    .box { background: #fff; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    input, select, textarea, button { width: 100%; padding: 12px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    button.red { background: #dc2626; }
    button.green { background: #16a34a; }
    .announcements { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    .price { font-size: 1.2em; font-weight: bold; color: #16a34a; }
  </style>
</head>
<body>

  <h1>Elan Saytı</h1>

  <!-- Giriş və Qeydiyyat -->
  <div class="box" id="auth-box">
    <h3>Giriş / Qeydiyyat</h3>
    <input type="text" id="fullname" placeholder="Ad və Soyadınız">
    <input type="email" id="email" placeholder="E-poçt ünvanı">
    <input type="password" id="password" placeholder="Şifrə">
    <button onclick="signUp()" class="green">Qeydiyyatdan Keç</button>
    <button onclick="signIn()">Giriş Et</button>
  </div>

  <div class="box" id="user-box" style="display: none;">
    <h3 id="user-name"></h3>
    <button onclick="signOut()" class="red">Çıxış Et</button>
  </div>

  <!-- Elan Əlavə Et -->
  <div class="box">
    <h3>Yeni Elan Əlavə Et</h3>
    <input type="text" id="title" placeholder="Elan başlığı">
    <input type="number" id="price" placeholder="Qiymət (AZN)">
    <input type="tel" id="phone" placeholder="Əlaqə nömrəsi">
    <select id="category">
      <option value="Nəqliyyat">Nəqliyyat</option>
      <option value="Daşınmaz Əmlak">Daşınmaz Əmlak</option>
      <option value="Elektronika">Elektronika</option>
      <option value="Digər">Digər</option>
    </select>
    <textarea id="description" placeholder="Ətraflı məlumat"></textarea>
    <input type="file" id="image" accept="image/*">
    <button onclick="addAnnouncement()" class="green">Elanı Yerləşdir</button>
  </div>

  <h2>Elanlar</h2>
  <div class="announcements" id="list"></div>

  <script>
    const SUPABASE_URL = "https://sqtiawgpiyevphybilen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qLFPLKZe80duJ7zYssQJXg_1lu_lsMV";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullname').value;

      if (!email || !password || !fullName) return alert("Bütün xanaları doldurun!");

      const { error } = await _supabase.auth.signUp({
        email, password, options: { data: { full_name: fullName } }
      });

      if (error) alert("Xəta: " + error.message);
      else alert("Qeydiyyat tamamlandı! İndi 'Giriş Et' düyməsini sıxın.");
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) alert("Giriş xətası: " + error.message);
      else location.reload();
    }

    async function signOut() {
      await _supabase.auth.signOut();
      location.reload();
    }

    async function checkUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('user-box').style.display = 'block';
        const name = user.user_metadata?.full_name || user.email;
        document.getElementById('user-name').innerText = "Xoş gəldiniz, " + name;
      }
    }

    async function loadAnnouncements() {
      const { data: { user } } = await _supabase.auth.getUser();
      const { data, error } = await _supabase.from('announcements').select('*').order('id', { ascending: false });

      if (error) return console.error(error);

      const list = document.getElementById('list');
      list.innerHTML = '';

      data.forEach(item => {
        const isOwner = user && user.id === item.user_id;
        const owner = item.full_name || item.owner_name || 'İstifadəçi';

        list.innerHTML += `
          <div class="card">
            ${item.image_url ? `<img src="${item.image_url}">` : ''}
            <h3>${item.title}</h3>
            <p class="price">${item.price} AZN</p>
            <p><b>Kateqoriya:</b> ${item.category}</p>
            <p>${item.description || ''}</p>
            <p><b>Əlaqə:</b> ${item.phone}</p>
            <p><b>Elan sahibi:</b> ${owner}</p>
            ${isOwner ? `<button onclick="deleteItem('${item.id}')" class="red">Sil</button>` : ''}
          </div>
        `;
      });
    }

    async function addAnnouncement() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) return alert("Əvvəlcə daxil olun!");

      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const phone = document.getElementById('phone').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const imageFile = document.getElementById('image').files[0];

      if (!title || !price || !phone) return alert("Başlıq, qiymət və nömrə vacibdir!");

      let image_url = '';

      if (imageFile) {
        const fileName = Date.now() + '_' + imageFile.name;
        const { error: upErr } = await _supabase.storage.from('announcement-images').upload(fileName, imageFile);
        if (upErr) return alert("Şəkil xətası: " + upErr.message);

        const { data: urlData } = _supabase.storage.from('announcement-images').getPublicUrl(fileName);
        image_url = urlData.publicUrl;
      }

      const name = user.user_metadata?.full_name || user.email;

      const { error } = await _supabase.from('announcements').insert([{
        title, price, phone, category, description, image_url, user_id: user.id, full_name: name, owner_name: name
      }]);

      if (error) alert("Elan xətası: " + error.message);
      else location.reload();
    }

    async function deleteItem(id) {
      if (!confirm("Silməyə əminsiniz?")) return;
      await _supabase.from('announcements').delete().eq('id', id);
      location.reload();
    }

    checkUser();
    loadAnnouncements();
  </script>
</body>
</html>

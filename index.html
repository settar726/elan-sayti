<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElanBazar - Elanlar Saytı</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --border:#e3e5e9; --border-strong:#c9ccd2;
    --text:#1c1e21; --text2:#5b5f66; --muted:#8b8f97;
    --accent:#178a5b; --accent-dark:#0f6a45; --accent-bg:#e6f5ee;
    --danger:#d33a2c; --vip:#ffb703; --vip-bg:#fff9e6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* header */
  header{position:sticky;top:0;z-index:50;background:var(--accent);color:#fff;padding:10px 14px;}
  .header-row{display:flex;align-items:center;gap:10px;}
  .logo{font-weight:700;font-size:19px;letter-spacing:-0.5px;white-space:nowrap;}
  .search-box{flex:1;display:flex;background:#fff;border-radius:8px;overflow:hidden;}
  .search-box input{flex:1;border:none;padding:9px 10px;font-size:14px;outline:none;}
  .search-box button{border:none;background:#fff;padding:0 10px;color:var(--accent);font-size:16px;}
  .auth-nav-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;}

  main{max-width:480px;margin:0 auto;padding:12px;padding-bottom:70px;}

  /* breadcrumb */
  .crumb{font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .crumb span.sep{color:var(--muted);}
  .crumb a{color:var(--accent-dark);}

  /* category grid */
  .cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .cat-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
  .cat-card .icon{width:40px;height:40px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent-dark);}
  .cat-card .name{font-size:13.5px;font-weight:500;line-height:1.3;}
  .cat-card .count{font-size:11.5px;color:var(--muted);}

  h1.section-title{font-size:16px;font-weight:600;margin:18px 0 10px;}

  /* subcategory list */
  .subcat-list{display:flex;flex-direction:column;background:var(--card);border-radius:12px;border:0.5px solid var(--border);overflow:hidden;}
  .subcat-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:0.5px solid var(--border);font-size:14.5px;cursor:pointer;}
  .subcat-row:last-child{border-bottom:none;}
  .subcat-row .cnt{color:var(--muted);font-size:12.5px;}
  .subcat-row .chev{color:var(--muted);}

  /* filter bar */
  .filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .filter-bar select, .filter-bar input{border:0.5px solid var(--border-strong);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff;color:var(--text);white-space:nowrap;}
  .filter-bar input{width:80px;}

  /* listing cards */
  .listing-list{display:flex;flex-direction:column;gap:10px;}
  .listing-card{display:flex;gap:10px;background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;position:relative;}
  .listing-card.is-vip{background:var(--vip-bg);border:1.5px solid var(--vip);}
  .vip-tag{position:absolute;top:8px;right:8px;background:var(--vip);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;}
  .listing-thumb{width:78px;height:78px;border-radius:8px;background:var(--accent-bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent-dark);overflow:hidden;}
  .listing-thumb img{width:100%;height:100%;object-fit:cover;}
  .listing-info{flex:1;min-width:0;}
  .listing-title{font-size:14px;font-weight:500;margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .listing-price{font-size:15px;font-weight:600;color:var(--accent-dark);margin:0 0 4px;}
  .listing-meta{font-size:12px;color:var(--muted);}

  .empty-state{text-align:center;padding:40px 16px;color:var(--muted);}
  .empty-state .big-icon{font-size:34px;margin-bottom:10px;}

  /* detail page */
  .detail-img{width:100%;aspect-ratio:4/3;background:var(--accent-bg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--accent-dark);overflow:hidden;margin-bottom:12px;}
  .detail-img img{width:100%;height:100%;object-fit:cover;}
  .detail-price{font-size:22px;font-weight:700;color:var(--accent-dark);margin:0 0 4px;}
  .detail-title{font-size:16px;font-weight:600;margin:0 0 8px;}
  .detail-meta-row{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;}
  .detail-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .detail-card h3{font-size:13px;color:var(--text2);margin:0 0 8px;font-weight:500;}
  .detail-card p{font-size:14px;line-height:1.6;margin:0;white-space:pre-wrap;}
  .contact-row{display:flex;align-items:center;gap:10px;}
  .contact-row .av{width:36px;height:36px;border-radius:50%;background:var(--accent-bg);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;}
  .call-btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;margin-top:10px;}

  /* bonus box */
  .bonus-box{background:linear-gradient(135deg, #178a5b, #0f6a45);color:#fff;border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .bonus-amount{font-size:20px;font-weight:700;}

  /* form */
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500;}
  .form-group input, .form-group select, .form-group textarea{width:100%;border:0.5px solid var(--border-strong);border-radius:8px;padding:10px;font-size:14.5px;background:#fff;color:var(--text);}
  .form-group textarea{min-height:90px;resize:vertical;}
  .form-row{display:flex;gap:10px;}
  .form-row .form-group{flex:1;}
  .submit-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:600;margin-top:6px;}
  .logout-btn{width:100%;background:var(--danger);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;margin-top:14px;}
  .vip-btn{background:var(--vip);color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;margin-top:6px;}
  .err{color:var(--danger);font-size:12.5px;margin-top:4px;}

  /* tabs for auth */
  .auth-tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .auth-tab{flex:1;text-align:center;padding:10px;font-weight:600;cursor:pointer;color:var(--text2);}
  .auth-tab.active{color:var(--accent-dark);border-bottom:2px solid var(--accent-dark);}

  /* bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid var(--border);display:flex;z-index:50;}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted);cursor:pointer;}
  .bottom-nav a.active{color:var(--accent-dark);}
  .bottom-nav .ic{font-size:19px;}

  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}

  .action-btns{display:flex;gap:6px;margin-top:6px;}
  .del-btn{background:var(--danger);color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="header-row" id="header-row"></div>
</header>

<main id="main"></main>

<div class="bottom-nav" id="bottom-nav"></div>
<div class="toast" id="toast"></div>

<script>
const BONUS_PER_POST = 5; 
const VIP_COST = 10;      

const CATEGORIES = [
  {id:'elektronika', name:'Elektronika', icon:'💻', subs:['Noutbuk','Planşet','Foto/Video kamera','Oyun konsolları','Kompüter aksesuarları','Televizor','Digər elektronika']},
  {id:'neqliyyat', name:'Nəqliyyat', icon:'🚗', subs:['Minik avtomobilləri','Motosikletlər','Velosipedlər','Yük nəqliyyatı','Su nəqliyyatı','Digər nəqliyyat']},
  {id:'ehtiyat', name:'Ehtiyat hissələri', icon:'🔧', subs:['Mühərrik hissələri','Şin/Disklər','Akkumulyatorlar','Audio/siqnalizasiya','Salon aksesuarları','Digər ehtiyat hissələri']},
  {id:'emlak', name:'Daşınmaz Əmlak', icon:'🏠', subs:['Mənzil satılır','Mənzil kirayə','Həyət evi/Villa','Torpaq sahəsi','Ofis/Obyekt','Qaraj']},
  {id:'meiset', name:'Məişət texnikası', icon:'🍳', subs:['Soyuducu','Paltaryuyan maşın','Kondisioner','Mətbəx texnikası','Toz sorucu','Digər məişət texnikası']},
  {id:'telefon', name:'Telefon', icon:'📱', subs:['Smartfonlar','Düyməli telefonlar','Telefon aksesuarları','Ehtiyat hissələri (telefon)']},
  {id:'is', name:'İş elanları', icon:'💼', subs:['Tam ştat','Yarım ştat','Uzaqdan iş','Təcrübə/Stajirovka','Gündəlik iş']},
];

const CITIES = ['Bakı','Gəncə','Sumqayıt','Mingəçevir','Şəki','Xankəndi','Naxçıvan','Lənkəran','Şirvan'];

// Nümunə test elanları
let LISTINGS = [
  {id:'1', title:'iPhone 13 Pro 128GB Blue', category:'telefon', subcategory:'Smartfonlar', price:1350, city:'Bakı', createdAt: Date.now() - 3600000, isVip: true, sellerName:'Əli M.', phone:'+994501234567', description:'Əla vəziyyətdədir, heç bir problemi yoxdur.'},
  {id:'2', title:'BMW 525i E39 2.5L 2002', category:'neqliyyat', subcategory:'Minik avtomobilləri', price:12800, city:'Gəncə', createdAt: Date.now() - 86400000, isVip: false, sellerName:'Rəşad', phone:'+994559876543', description:'Təcili satılır, real alıcıya endirim olacaq.'}
];

let USERS = [];
let CURRENT_USER = {id:'u1', name:'Məmməd', bonus:15};
let ROUTE = {page:'home'};

function esc(s){ const d=document.createElement('div'); d.innerText = s==null?'':String(s); return d.innerHTML; }
function fmtPrice(n, cat){
  if(cat==='is') return esc(n) + ' AZN/ay';
  return Number(n).toLocaleString('az-AZ') + ' AZN';
}
function timeAgo(ts){
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff<60) return 'indicə';
  if(diff<3600) return Math.floor(diff/60)+' dəq əvvəl';
  if(diff<86400) return Math.floor(diff/3600)+' saat əvvəl';
  return Math.floor(diff/86400)+' gün əvvəl';
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function nav(route){ ROUTE = route; window.scrollTo(0,0); render(); }

function catById(id){ return CATEGORIES.find(c=>c.id===id); }

function sortListings(list){
  return [...list].sort((a,b)=>{
    if(a.isVip && !b.isVip) return -1;
    if(!a.isVip && b.isVip) return 1;
    return b.createdAt - a.createdAt;
  });
}

function renderHeader(){
  const row = document.getElementById('header-row');
  row.innerHTML = `
    <a href="#" onclick="nav({page:'home'});return false;" class="logo">ElanBazar</a>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Nə axtarırsınız?" value="${ROUTE.page==='search'&&ROUTE.query?esc(ROUTE.query):''}"/>
      <button onclick="doSearch()">🔍</button>
    </div>
    ${CURRENT_USER ? 
      `<button class="auth-nav-btn" onclick="nav({page:'my'})">${esc(CURRENT_USER.name)} (${CURRENT_USER.bonus||0} bonus)</button>` : 
      `<button class="auth-nav-btn" onclick="nav({page:'auth', tab:'login'})">Giriş</button>`
    }
  `;
}

function doSearch(){
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;
  nav({page:'search', query:q});
}

function renderBottomNav(){
  const nb = document.getElementById('bottom-nav');
  const active = (p)=> ROUTE.page===p ? 'active' : '';
  nb.innerHTML = `
    <a class="${active('home')}" onclick="nav({page:'home'})"><span class="ic">🏠</span>Ana səhifə</a>
    <a class="${active('add')}" onclick="nav({page:'add'})"><span class="ic">➕</span>Elan ver</a>
    <a class="${active('my')}" onclick="nav({page:'my'})"><span class="ic">👤</span>Hesabım</a>
  `;
}

function pageHome(){
  const totalCount = (catId)=> LISTINGS.filter(l=>l.category===catId).length;
  let html = `<h1 class="section-title" style="margin-top:4px;">Kateqoriyalar</h1><div class="cat-grid">`;
  CATEGORIES.forEach(c=>{
    html += `<div class="cat-card" onclick="nav({page:'category',cat:'${c.id}'})">
      <div class="icon">${c.icon}</div>
      <div class="name">${esc(c.name)}</div>
      <div class="count">${totalCount(c.id)} elan</div>
    </div>`;
  });
  html += `</div>`;

  const recent = sortListings(LISTINGS).slice(0,10);
  html += `<h1 class="section-title">Son elanlar</h1>`;
  html += renderListingList(recent);
  return html;
}

function pageCategory(){
  const cat = catById(ROUTE.cat);
  if(!cat) return `<p>Kateqoriya tapılmadı.</p>`;
  let html = `<div class="crumb"><a href="#" onclick="nav({page:'home'});return false;">Ana səhifə</a><span class="sep">›</span><span>${esc(cat.name)}</span></div>`;
  html += `<div class="subcat-list">`;
  cat.subs.forEach(s=>{
    const cnt = LISTINGS.filter(l=>l.category===cat.id && l.subcategory===s).length;
    html += `<div class="subcat-row" onclick="nav({page:'listings',cat:'${cat.id}',sub:'${esc(s)}'})">
      <span>${esc(s)}</span>
      <span style="display:flex;align-items:center;gap:6px;"><span class="cnt">${cnt}</span><span class="chev">›</span></span>
    </div>`;
  });
  html += `</div>`;
  html += `<h1 class="section-title">Bütün "${esc(cat.name)}" elanları</h1>`;
  const items = sortListings(LISTINGS.filter(l=>l.category===cat.id));
  html += renderListingList(items);
  return html;
}

function renderListingList(items, showManageBtns = false){
  if(items.length===0){
    return `<div class="empty-state"><div class="big-icon">🔍</div>Elan tapılmadı</div>`;
  }
  let html = `<div class="listing-list">`;
  items.forEach(l=>{
    const cat = catById(l.category);
    html += `<div class="listing-card ${l.isVip?'is-vip':''}" onclick="nav({page:'detail',id:'${l.id}'})">
      ${l.isVip ? `<div class="vip-tag">VIP</div>` : ''}
      <div class="listing-thumb">${l.image?`<img src="${esc(l.image)}"/>`:(cat?cat.icon:'')}</div>
      <div class="listing-info">
        <p class="listing-title">${esc(l.title)}</p>
        <p class="listing-price">${fmtPrice(l.price, l.category)}</p>
        <p class="listing-meta">${esc(l.city)} · ${timeAgo(l.createdAt)}</p>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function pageDetail(){
  const l = LISTINGS.find(x=>x.id===ROUTE.id);
  if(!l) return `<p>Elan tapılmadı.</p>`;
  const cat = catById(l.category);
  let html = `<div class="crumb"><a href="#" onclick="nav({page:'home'});return false;">Ana səhifə</a><span class="sep">›</span><a href="#" onclick="nav({page:'category',cat:'${l.category}'});return false;">${esc(cat?cat.name:'')}</a></div>`;
  html += `<div class="detail-img">${l.image?`<img src="${esc(l.image)}"/>`:(cat?cat.icon:'')}</div>`;
  html += `<p class="detail-price">${fmtPrice(l.price, l.category)} ${l.isVip?'<span class="vip-tag" style="position:static;display:inline-block;margin-left:8px;">VIP</span>':''}</p>`;
  html += `<p class="detail-title">${esc(l.title)}</p>`;
  html += `<div class="detail-meta-row"><span>📍 ${esc(l.city)}</span><span>🕒 ${timeAgo(l.createdAt)}</span><span>${esc(cat?cat.name:'')}${l.subcategory?' · '+esc(l.subcategory):''}</span></div>`;
  html += `<div class="detail-card"><h3>Təsvir</h3><p>${esc(l.description||'Təsvir yoxdur.')}</p></div>`;
  html += `<div class="detail-card">
    <h3>Əlaqə</h3>
    <div class="contact-row">
      <div class="av">${esc((l.sellerName||'İ').charAt(0).toUpperCase())}</div>
      <div><div style="font-size:14px;font-weight:500;">${esc(l.sellerName||'İstifadəçi')}</div><div style="font-size:12.5px;color:var(--muted);">Elan sahibi</div></div>
    </div>
    <button class="call-btn" onclick="showToast('Nömrə: ${esc(l.phone||'qeyd olunmayıb')}')">📞 ${esc(l.phone||'Nömrəni göstər')}</button>
  </div>`;
  return html;
}

function render(){
  renderHeader();
  renderBottomNav();
  const main = document.getElementById('main');
  if(ROUTE.page === 'home') main.innerHTML = pageHome();
  else if(ROUTE.page === 'category') main.innerHTML = pageCategory();
  else if(ROUTE.page === 'detail') main.innerHTML = pageDetail();
  else main.innerHTML = pageHome();
}

window.onload = () => { render(); };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elan Saytı</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFF7EC;
      --ink: #24211E;
      --tangerine: #FF6B35;
      --violet: #6C5CE7;
      --emerald: #00A67D;
      --sunshine: #FFC93C;
      --sky: #2E9CCA;
      --card-bg: #FFFFFF;
      --line: rgba(36,33,30,0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 0 14px 40px;
      background:
        radial-gradient(circle at 8% 0%, rgba(255,201,60,0.35), transparent 40%),
        radial-gradient(circle at 92% 10%, rgba(108,92,231,0.18), transparent 45%),
        var(--cream);
      color: var(--ink);
    }

    /* ---------- Hero ---------- */
    .hero {
      padding: 28px 4px 18px;
      text-align: left;
    }
    .hero .eyebrow-dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--violet);
      margin-bottom: 6px;
    }
    .hero .eyebrow-dot::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--tangerine);
      display: inline-block;
    }
    h1 {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 2.5rem;
      line-height: 1.05;
      margin: 0;
      color: var(--ink);
    }
    h1 span { color: var(--tangerine); }
    .hero p.tag {
      margin: 8px 0 0;
      font-size: 1rem;
      color: #55504A;
      max-width: 34ch;
    }

    /* ---------- Auth card ---------- */
    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      margin: 18px 0;
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(36,33,30,0.06);
    }
    .auth-card h3 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.15rem;
      margin: 0 0 12px;
      color: var(--ink);
    }
    .field {
      width: 100%;
      padding: 12px 14px;
      margin: 0 0 10px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: #FCFAF6;
    }
    .field:focus {
      outline: none;
      border-color: var(--violet);
      background: #fff;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { width: auto; flex: 1; }
    .btn-primary { background: var(--tangerine); color: #fff; box-shadow: 0 6px 14px rgba(255,107,53,0.30); }
    .btn-secondary { background: var(--violet); color: #fff; box-shadow: 0 6px 14px rgba(108,92,231,0.28); }
    .btn-danger { background: #fff; color: #E4483A; border: 1.5px solid #F3B3AC; box-shadow: none; }
    .btn-danger:hover { background: #FFF1EF; }

    #user-info p {
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--ink);
    }
    #user-info p::before {
      content: "👋 ";
    }

    /* ---------- New listing form ---------- */
    .form-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      margin: 0 0 26px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(36,33,30,0.06);
      position: relative;
      overflow: hidden;
    }
    .form-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--tangerine), var(--sunshine), var(--violet), var(--sky));
    }
    .form-container h3 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.3rem;
      margin: 8px 0 14px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      margin: 0 0 10px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: #FCFAF6;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--tangerine);
      background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    select { -webkit-appearance: none; appearance: none; }
    input[type="file"] {
      background: #FCFAF6;
      padding: 10px 12px;
    }
    .form-container button {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: var(--emerald);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,166,125,0.30);
      margin-top: 4px;
    }
    .form-container button:active { transform: scale(0.99); }

    /* ---------- Listings ---------- */
    h2.section-title {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.5rem;
      margin: 6px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h2.section-title::after {
      content: "";
      flex: 1;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    }

    .announcements {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 0 0 14px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(36,33,30,0.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }
    .card .card-body { padding: 14px 16px 0; }
    .card h3 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.1rem;
      margin: 0 0 6px;
      line-height: 1.25;
    }
    .price {
      display: inline-block;
      color: var(--emerald);
      font-weight: 800;
      font-size: 1.15rem;
      margin: 0 0 10px;
    }
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin: 0 0 10px;
      color: #fff;
    }
    .cat-pill.cat-neqliyyat { background: var(--sky); }
    .cat-pill.cat-emlak { background: var(--violet); }
    .cat-pill.cat-elektronika { background: var(--tangerine); }
    .cat-pill.cat-diger { background: #8A8578; }

    .card p.desc {
      font-size: 0.9rem;
      color: #55504A;
      margin: 0 0 10px;
      line-height: 1.4;
    }
    .card p.contact {
      font-size: 0.88rem;
      margin: 0 0 12px;
      color: var(--ink);
    }
    .card p.contact strong { color: #8A8578; font-weight: 600; }

    .card button.delete-btn {
      margin: 0 16px;
      width: calc(100% - 32px);
      background: #fff;
      color: #E4483A;
      border: 1.5px solid #F3B3AC;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: #8A8578;
      font-size: 0.95rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .card, .form-container button { transition: none; }
    }

    :focus-visible {
      outline: 2.5px solid var(--violet);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="eyebrow-dot">Bazar açıqdır</div>
    <h1>Elan <span>Saytı</span></h1>
    <p class="tag">Al, sat, elan yerləşdir — hamısı bir yerdə.</p>
  </div>

  <div id="auth-container" class="auth-card">
    <div id="auth-inputs">
        <h3>Giriş / Qeydiyyat</h3>
        <input type="email" id="auth-email" class="field" placeholder="E-poçt ünvanı">
        <input type="password" id="auth-password" class="field" placeholder="Şifrə">
        <div class="btn-row">
          <button onclick="signIn()" class="btn btn-primary">Giriş Et</button>
          <button onclick="signUp()" class="btn btn-secondary">Qeydiyyat</button>
        </div>
    </div>
    <div id="user-info" style="display: none;">
        <p id="user-email"></p>
        <button onclick="signOut()" class="btn btn-danger">Çıxış Et</button>
    </div>
  </div>

  <div class="form-container">
    <h3>Yeni Elan Əlavə Et</h3>
    <input type="text" id="title" placeholder="Elanın başlığı" required>
    <input type="number" id="price" placeholder="Qiymət (AZN)" required>
    <input type="tel" id="phone" placeholder="Əlaqə nömrəsi" required>
    <select id="category">
      <option value="Nəqliyyat">Nəqliyyat</option>
      <option value="Daşınmaz Əmlak">Daşınmaz Əmlak</option>
      <option value="Elektronika">Elektronika</option>
      <option value="Digər">Digər</option>
    </select>
    <textarea id="description" placeholder="Ətraflı məlumat"></textarea>
    <input type="file" id="image" accept="image/*">
    <button onclick="addAnnouncement()">Elanı Yerləşdir</button>
  </div>

  <h2 class="section-title">Son Elanlar</h2>
  <div class="announcements" id="announcements-list"></div>

  <script>
    const SUPABASE_URL = "https://sqtiawgpiyevphybilen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qLFPLKZe80duJ7zYssQJXg_1lu_lsMV";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function categoryClass(cat) {
      switch (cat) {
        case 'Nəqliyyat': return 'cat-neqliyyat';
        case 'Daşınmaz Əmlak': return 'cat-emlak';
        case 'Elektronika': return 'cat-elektronika';
        default: return 'cat-diger';
      }
    }

    async function loadAnnouncements() {
      const { data: { user } } = await _supabase.auth.getUser();
      const { data, error } = await _supabase.from('announcements').select('*');
      if (error) return console.error(error);

      const container = document.getElementById('announcements-list');
      if (!container) return;
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state">Hələ elan yoxdur. İlk elanı sən yerləşdir!</div>';
        return;
      }

      data.forEach(item => {
        const isOwner = user && user.id === item.user_id;
        container.innerHTML += `
            <div class="card">
                ${item.image_url ? `<img src="${item.image_url}">` : ''}
                <div class="card-body">
                  <h3>${item.title}</h3>
                  <p class="price">${item.price} AZN</p>
                  <br>
                  <span class="cat-pill ${categoryClass(item.category)}">${item.category}</span>
                  <p class="desc">${item.description || ''}</p>
                  <p class="contact"><strong>Əlaqə:</strong> ${item.phone}</p>
                </div>
                ${isOwner ? `<button class="delete-btn" onclick="deleteAnnouncement('${item.id}')">Elanı Sil</button>` : ''}
            </div>
        `;
      });
    }

    async function addAnnouncement() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) return alert("Elan yerləşdirmək üçün əvvəlcə daxil olmalısınız!");

      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const phone = document.getElementById('phone').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const imageFile = document.getElementById('image').files[0];

      if (!title || !price || !phone) {
        alert('Lütfən başlığı, qiyməti və nömrəni qeyd edin.');
        return;
      }

      let image_url = '';

      if (imageFile) {
        const fileName = Date.now() + '_' + imageFile.name;
        const { data, error } = await _supabase.storage.from('announcement-images').upload(fileName, imageFile);
        if (error) {
          alert('Şəkil yüklənərkən xəta oldu: ' + error.message);
          return;
        }
        const { data: publicUrlData } = _supabase.storage.from('announcement-images').getPublicUrl(fileName);
        image_url = publicUrlData.publicUrl;
      }

      const { error } = await _supabase.from('announcements').insert([
        { title, price, phone, category, description, image_url, user_id: user.id }
      ]);

      if (error) {
        alert('Elan xətası: ' + error.message);
      } else {
        alert('Elan uğurla əlavə olundu!');
        location.reload();
      }
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Bu elanı silməyə əminsiniz?')) return;

      const { error } = await _supabase
          .from('announcements')
          .delete()
          .eq('id', id);

      if (error) {
          alert('Xəta baş verdi: ' + error.message);
      } else {
          alert('Elan uğurla silindi!');
          location.reload();
      }
    }

    async function signUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert('E-poçt və şifrəni daxil edin!');

      const { error } = await _supabase.auth.signUp({ email, password });
      if (error) alert("Qeydiyyat xətası: " + error.message);
      else alert("Qeydiyyat uğurludur! Giriş edə bilərsiniz.");
    }

    async function signIn() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert('E-poçt və şifrəni daxil edin!');

      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) alert("Giriş xətası: " + error.message);
      else {
          alert("Giriş edildi!");
          location.reload();
      }
    }

    async function signOut() {
      await _supabase.auth.signOut();
      location.reload();
    }

    async function checkUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
          document.getElementById('auth-inputs').style.display = 'none';
          document.getElementById('user-info').style.display = 'block';
          document.getElementById('user-email').innerText = "Hesab: " + user.email;
      }
    }

    checkUser();
    loadAnnouncements();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elan Saytı</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
    h1 { text-align: center; color: #333; }
    .form-container { background: #fff; padding: 15px; border-radius: 8px; max-width: 400px; margin: 0 auto 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    .announcements { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .card { background: white; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    .price { color: #28a745; font-weight: bold; font-size: 1.2em; }
  </style>
</head>
<body>

  <h1>Elan Saytı</h1>
  <div id="auth-container" style="background: white; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #ddd;">
    <div id="auth-inputs">
        <h3 style="margin-top:0;">Giriş / Qeydiyyat</h3>
        <input type="email" id="auth-email" placeholder="E-poçt ünvanı" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box;">
        <input type="password" id="auth-password" placeholder="Şifrə" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box;">
        <button onclick="signIn()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Giriş Et</button>
        <button onclick="signUp()" style="background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Qeydiyyat</button>
    </div>
    <div id="user-info" style="display: none;">
        <p id="user-email" style="font-weight: bold; margin-top: 0;"></p>
        <button onclick="signOut()" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Çıxış Et</button>
    </div>
  </div>
  

  <div class="form-container">
    <h3>Yeni Elan Əlavə Et</h3>
    <input type="text" id="title" placeholder="Elanın başlığı" required>
    <input type="number" id="price" placeholder="Qiymət (AZN)" required>
    <input type="tel" id="phone" placeholder="Əlaqə nömrəsi" required>
    <select id="category">
      <option value="Nəqliyyat">Nəqliyyat</option>
      <option value="Daşınmaz Əmlak">Daşınmaz Əmlak</option>
      <option value="Elektronika">Elektronika</option>
      <option value="Digər">Digər</option>
    </select>
    <textarea id="description" placeholder="Ətraflı məlumat"></textarea>
    <input type="file" id="image" accept="image/*">
    <button onclick="addAnnouncement()">Elanı Yerləşdir</button>
  </div>

  <h2>Son Elanlar</h2>
  <div class="announcements" id="announcements-list"></div>

  <script>
    const SUPABASE_URL = "https://sqtiawgpiyevphybilen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qLFPLKZe80duJ7zYssQJXg_1lu_lsMV";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAnnouncements() {
    const { data: { user } } = await _supabase.auth.getUser();
    const { data, error } = await _supabase.from('announcements').select('*');
    if (error) return console.error(error);

    const container = document.getElementById('announcements');
    container.innerHTML = '';

    data.forEach(item => {
        const isOwner = user && user.id === item.user_id;
        container.innerHTML += `
            <div class="card">
                ${item.image_url ? `<img src="${item.image_url}">` : ''}
                <h3>${item.title}</h3>
                <p class="price">${item.price} AZN</p>
                <p><strong>Kateqoriya:</strong> ${item.category}</p>
                <p>${item.description || ''}</p>
                <p><strong>Əlaqə:</strong> ${item.phone}</p>
                ${isOwner ? `<button onclick="deleteAnnouncement('${item.id}')" style="background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Elanı Sil</button>` : ''}
            </div>
        `;
    });
    }
    
    

    async function addAnnouncement() {
          const { data: { user } } = await _supabase.auth.getUser();
    if (!user) return alert("Elan yerləşdirmək üçün əvvəlcə daxil olmalısınız!");
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const phone = document.getElementById('phone').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const imageFile = document.getElementById('image').files[0];

      if (!title || !price || !phone) {
        alert('Lütfən başlığı, qiyməti və nömrəni qeyd edin.');
        return;
      }

      let image_url = '';

          if (imageFile) {
      const fileName = Date.now() + '_' + imageFile.name;
      const { data, error } = await _supabase.storage.from('announcement-images').upload(fileName, imageFile);
      if (error) {
        alert('Şəkil yüklənərkən xəta oldu!');
        return;
      }
      const { data: publicUrlData } = _supabase.storage.from('announcement-images').getPublicUrl(fileName);
      image_url = publicUrlData.publicUrl;
          }
      

          const { error } = await _supabase.from('announcements').insert([{ title, price, phone, category, description, image_url, user_id: user.id }]);

      if (error) {
        alert('Elan əlavə edilmədi!');
      } else {
        alert('Elan uğurla əlavə olundu!');
        location.reload();
      }
    }

    loadAnnouncements();

  async function deleteAnnouncement(id) {
    if (!confirm('Bu elanı silməyə əminsiniz?')) return;

    const { error } = await _supabase
        .from('announcements')
        .delete()
        .eq('id', id);

    if (error) {
        alert('Xəta baş verdi: ' + error.message);
    } else {
        alert('Elan uğurla silindi!');
        location.reload();
    }
  }
    
  
  // Qeydiyyat funksiyası
async function signUp() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    if (!email || !password) return alert('E-poçt və şifrəni daxil edin!');
    
    const { error } = await _supabase.auth.signUp({ email, password });
    if (error) alert("Qeydiyyat xətası: " + error.message);
    else alert("Qeydiyyat uğurludur! Giriş edə bilərsiniz.");
}

// Giriş funksiyası
async function signIn() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    if (!email || !password) return alert('E-poçt və şifrəni daxil edin!');

    const { error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) alert("Giriş xətası: " + error.message);
    else {
        alert("Giriş edildi!");
        location.reload();
    }
}

// Çıxış funksiyası
async function signOut() {
    await _supabase.auth.signOut();
    location.reload();
}

// İstifadəçini yoxlamaq
async function checkUser() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (user) {
        document.getElementById('auth-inputs').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-email').innerText = "Hesab: " + user.email;
    }
}
checkUser();
</script>
</body>
</html>
